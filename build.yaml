builders:
  model:
    import: "package:flutter_base/builder.dart"
    builder_factories: [ "elModelBuilder" ]
    build_extensions: { ".dart": [ ".g.part" ] }
    auto_apply: dependents
    build_to: cache
    applies_builders: [ "source_gen:combining_builder" ]
  sourceGenerator:
    import: "package:flutter_base/builder.dart"
    builder_factories: [ "elSourceGeneratorBuilder" ]
    build_extensions: { ".dart": [ ".g.part" ] }
    auto_apply: dependents
    build_to: cache
    applies_builders: [ "source_gen:combining_builder" ]

targets:
  $default:
    auto_apply_builders: true
    sources:
      - lib/**
      - test/**
      - $package$
    builders:
      source_gen:combining_builder:
        options:
          build_extensions:
            # 当前样式模型的生成产物落在同目录 .g.dart。
            '^lib/src/flutter/views/view/style/style.dart': 'lib/src/flutter/views/view/style/style.g.dart'
            # 组件实现登记表的 copyWith、merge 与相等性。
            '^lib/src/flutter/components/index.dart': 'lib/src/flutter/components/index.g.dart'
            # 事件配置与回调的复制、合并和相等性。
            '^lib/src/flutter/views/view/event/event.dart': 'lib/src/flutter/views/view/event/event.g.dart'
            # 保留原有 view 生成目标配置。
            '^lib/src/ui/cores/view/{{}}.dart': 'lib/src/ui/cores/view/{{}}.g.dart'
            '^test/generator/models/{{}}.dart': 'test/generator/generates/models/{{}}.g.dart'
            '^test/generator/source_generator/{{}}.dart': 'test/generator/generates/source_generator/{{}}.g.dart'
      flutter_base|model:
        generate_for:
          - lib/src/flutter/views/view/style/style.dart
          - lib/src/flutter/components/index.dart
          - lib/src/flutter/views/view/event/event.dart
          - lib/src/ui/cores/view/semantics/semantics.dart
          - test/generator/models/**
      flutter_base|sourceGenerator:
        generate_for:
          - test/generator/source_generator/source.dart
