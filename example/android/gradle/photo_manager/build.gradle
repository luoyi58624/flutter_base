// 对应 photo_manager 3.12.0；上游移除旧 KGP 兼容分支后可删除此脚本及 settings 中的重定向。
// 只迁移 Kotlin 构建方式，源码、清单与依赖保持上游版本。
def sourceDir = project.property('photoManagerSourceDir') as File
def pubspec = new File(sourceDir.parentFile, 'pubspec.yaml').text
if (!(pubspec =~ /(?m)^version:\s*3\.12\.0\s*$/).find()) {
    throw new GradleException('photo_manager 版本已变化，请检查并移除或更新本地 Built-in Kotlin 构建适配。')
}
if (providers.gradleProperty('android.builtInKotlin').getOrElse('true') != 'true') {
    throw new GradleException('photo_manager 构建适配要求 android.builtInKotlin=true。')
}

group 'com.fluttercandies.photo_manager'
version '3.12.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.fluttercandies.photo_manager'
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 16
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.setRoot(new File(sourceDir, 'src/main').path)
        main.java.srcDirs += new File(sourceDir, 'src/main/kotlin')
        test.setRoot(new File(sourceDir, 'src/test').path)
        test.java.srcDirs += new File(sourceDir, 'src/test/kotlin')
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
