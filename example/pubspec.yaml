name: example
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_base:
    path: ../
  go_router: 17.3.0
  highlight: ^0.7.0
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Consolas
      fonts:
        - asset: assets/fonts/Consolas-Regular.ttf
  assets:
    - lib/src/pages/components/basic/button/examples/
    - lib/src/pages/components/basic/button_group/examples/
    - lib/src/pages/components/list/list_tile/examples/
