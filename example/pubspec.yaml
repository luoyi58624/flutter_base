name: example
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  android_system_font_weight: ^0.4.0
  faker: ^2.2.0
  flutter_base:
    path: ../
  go_router: 17.3.0
  highlight: ^0.7.0
  path_drawing: ^1.0.1
  photo_manager: 3.12.0
  photo_manager_image_provider: 2.2.0
  file_selector: 1.1.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  fc_native_video_thumbnail: 4.0.0
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Consolas
      fonts:
        - asset: assets/fonts/Consolas-Regular.ttf
  assets:
    - assets/showcase/
    - assets/recycler_cards/
