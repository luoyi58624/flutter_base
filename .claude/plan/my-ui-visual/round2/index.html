<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my-ui round 2 修复复验</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#182033;background:#eef1f6}body{margin:0}header,main{padding:24px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6;color:#526078}a{color:#2454c6}nav{display:flex;flex-wrap:wrap;gap:14px;padding:16px 24px;background:white;position:sticky;top:0}select,button{padding:8px;font:inherit;border:1px solid #cbd4e3;border-radius:8px;background:white}#pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}figcaption{padding:12px;background:white;font-weight:600}figure a{display:block;overflow:auto;border:1px solid #dce2ec}img{display:block;max-width:100%;height:auto}.actual img{max-width:none}.status{color:#805500;background:#fff4d6;border-radius:8px;padding:10px 14px;display:inline-block}@media(max-width:720px){#pair{grid-template-columns:1fr}}
</style>
<header><h1>my-ui · round 2 修复复验</h1><div class="status">glyph 尺寸已修复；字体契约已建立，文字行盒与基线仍有残差</div>
<p>全部原图为 390/1440×900，DPR 1；无头 Chrome 真源 Vue 与 flutter_tester 真实绘制。原有 8 组件加圆环尺寸组，共 36 对；状态补图 24 对。没有进入下一批 46 组件。</p>
<p><a href="../my-ui-visual-report.md">完整报告与残差</a> · <a href="measured-summary.json">度量</a> · <a href="screenshot-manifest.json">190 张 PNG 清单</a> · <a href="fix-proof-loading.png">Loading 修复前后</a> · <a href="fix-proof-progress.png">Progress 修复前后</a> · <a href="../index.html">首轮原图</a></p></header>
<nav><label>组件 <select id="component"></select></label><label>宽度 <select id="width"><option>390</option><option>1440</option></select></label><label>主题 <select id="theme"><option value="light">明</option><option value="dark">暗</option></select></label><label>状态 <select id="state"><option value="">变体合集</option><option value="focus">键盘焦点</option><option value="hover">悬浮</option><option value="pressed">按下</option></select></label><button id="zoom">按原始像素显示</button></nav>
<main><p id="note"></p><p><a id="compare">并排对照图</a></p><div id="pair"><figure><figcaption>Web · 真源 Vue</figcaption><a id="weblink"><img id="web" alt="Web 原图"></a></figure><figure><figcaption>Flutter · 修复后</figcaption><a id="flutterlink"><img id="flutter" alt="Flutter 原图"></a></figure></div></main>
<script>
const ids=['loading','progress','progress-sizes','button','tag','card','divider','skeleton','switch'];
const notes={loading:'实际 glyph 16 / 24 / 32，large 笔画覆盖与 Web 同为 28×28。',progress:'line 状态图标 18；96 圆环实际状态图标 26.88，已与圆环同心。','progress-sizes':'圆环 40 / 64 / 96 / 128，成功和失败均按 0.28 缩放；Web 有小于 1/64px 的尺寸量化差。',button:'Times New Roman + Microsoft YaHei。Save/Cancel 宽度差小于 0.015px；Save/Cancel 基线仍差约 −0.13 / +0.69px。',tag:'同源字体；剩余文本度量和抗锯齿差见报告。',card:'同源字体后默认卡片仍有行盒高度差：移动 2.21875px，桌面 1.859375px；阴影差保留。',divider:'同源字体，仍有行盒舍入与虚线栅格差；不宣称逐像素一致。',skeleton:'loaded 正文已统一为字体 normal 行高20；骨架尺寸不变。',switch:'47×28、thumb22不变；保留已记录的 Web UA 外边距差。'};
const q=id=>document.getElementById(id);ids.forEach(id=>q('component').add(new Option(id,id)));
function update(){const id=q('component').value,w=q('width').value,t=q('theme').value,available=['button','tag','card','switch'].includes(id)&&((w==='390'&&t==='light')||(w==='1440'&&t==='dark'));for(const o of q('state').options)if(o.value)o.disabled=!available;if(!available)q('state').value='';const s=q('state').value,key=id+'-'+w+'-'+t,prefix=s?'state-':'',suffix=s?'-'+s:'';for(const side of ['web','flutter']){const f=side+'-'+prefix+key+suffix+'.png';q(side).src=f;q(side+'link').href=f;}q('compare').href='compare-'+prefix+key+suffix+'.png';q('note').textContent=notes[id];}
for(const id of ['component','width','theme','state'])q(id).onchange=update;q('zoom').onclick=()=>{document.body.classList.toggle('actual');q('zoom').textContent=document.body.classList.contains('actual')?'适应页面显示':'按原始像素显示';};update();
</script></html>
