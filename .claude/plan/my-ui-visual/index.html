<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my-ui 视觉验收</title><style>
:root{color-scheme:light;font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#eef1f6;color:#182033}body{margin:0}header{padding:24px 28px;background:#fff;border-bottom:1px solid #dce2ec}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#58657a;line-height:1.6}nav{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 28px;background:#ffffffed;border-bottom:1px solid #dce2ec}label{font-size:13px}select,button{margin-left:6px;padding:9px 12px;border:1px solid #cbd4e3;border-radius:9px;background:#fff;color:inherit;font:inherit}a{color:#2454c6}main{padding:20px 28px}#note{font-size:14px}#pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;min-width:0}figcaption{padding:12px;background:white;border:1px solid #dce2ec;border-bottom:0;font-weight:600}figure a{display:block;overflow:auto;border:1px solid #dce2ec;background:#dce2ec}img{display:block;max-width:100%;height:auto}body.actual img{max-width:none}.warn{display:inline-block;padding:4px 10px;border-radius:20px;background:#fff1d6;color:#8b4f00}.links{display:flex;gap:16px;font-size:14px}@media(max-width:720px){#pair{grid-template-columns:1fr}header,nav,main{padding:16px}}
</style><header><h1>my-ui · 真实渲染对照</h1><span class="warn">验收结论：需先修首批</span><p>Web为真源Vue组件。Flutter为flutter_tester真实栅格化；原图均为390/1440逻辑宽、DPR 1、900高。点击图片查看原图。</p><div class="links"><a href="round2/index.html">round 2 修复复验（最新）</a><a href="my-ui-visual-report.md">逐组件报告</a><a href="measured-summary.json">尺寸记录</a><a href="pixel-comparison.json">像素差异记录</a></div></header>
<nav><label>组件<select id="component"></select></label><label>宽度<select id="width"><option>390</option><option>1440</option></select></label><label>主题<select id="theme"><option value="light">明色</option><option value="dark">暗色</option></select></label><label>状态<select id="state"><option value="">常规状态合集</option><option value="focus">Tab焦点</option><option value="hover">鼠标悬停</option><option value="pressed">鼠标按下</option></select></label><button id="zoom">按原始像素显示</button></nav>
<main><p id="note"></p><div id="pair"><figure><figcaption>Web · 真源Vue组件</figcaption><a id="weblink"><img id="web" alt="Web参照"></a></figure><figure><figcaption>Flutter · 当前实现</figcaption><a id="flutterlink"><img id="flutter" alt="Flutter当前实现"></a></figure></div><p><a id="example">查看Web example实体页面截图</a> · 基础64张 + example32张 + 状态48张；并排图另存。</p></main><script>
const ids=['button','tag','switch','card','divider','loading','progress','skeleton'],notes={button:'⚠️ 高度、圆角、颜色接近；字体影响宽度。',tag:'⚠️ 展示/选中/禁用几何与配色接近；字体存在差异。',switch:'⚠️ 47×28、thumb22及明暗配色一致；Web原生input有额外margin。',card:'⚠️ 响应式尺寸接近；字体、阴影及部分状态需看报告。',divider:'⚠️ 线条/文字间距接近；字体与虚线栅格略有差异。',loading:'❌ large外框32，但实际圆弧仍按24绘制。',progress:'❌ 圆环状态图标实际24，应为26.88；条形与圆环几何接近。',skeleton:'✅ 加载骨架尺寸与配色一致；已加载正文受宿主字体影响。'};
const q=id=>document.getElementById(id);ids.forEach(id=>q('component').add(new Option(id[0].toUpperCase()+id.slice(1),id)));
function update(){const id=q('component').value,w=q('width').value,t=q('theme').value;const available=['button','tag','switch','card'].includes(id)&&((w==='390'&&t==='light')||(w==='1440'&&t==='dark'));for(const opt of q('state').options)if(opt.value)opt.disabled=!available;if(!available)q('state').value='';const s=q('state').value,key=id+'-'+w+'-'+t,prefix=s?'state-':'',suffix=s?'-'+s:'';for(const side of['web','flutter']){const file=side+'-'+prefix+key+suffix+'.png';q(side).src=file;q(side+'link').href=file}q('example').href='example-'+key+'.png';q('note').textContent=notes[id]+(available?' 已补充focus / hover / pressed。':'');}
for(const id of['component','width','theme','state'])q(id).onchange=update;q('zoom').onclick=()=>{document.body.classList.toggle('actual');q('zoom').textContent=document.body.classList.contains('actual')?'适应页面显示':'按原始像素显示'};update();
</script></html>
